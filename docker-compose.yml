version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sahakaar_seva
      POSTGRES_USER: sahakaar
      POSTGRES_PASSWORD: sahakaar123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://sahakaar:sahakaar123@db:5432/sahakaar_seva
      SECRET_KEY: dev-secret-key-change-in-production-32chars
    depends_on:
      - db
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
